[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsrlab"
version = "0.1.0"
description = "Procedural SFX synthesis lab for games (oscillators + ADSR + sweeps + noise + mixing) in Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nishanth Kottapalli", email = "nishanth.tf141@gmail.com" }]
dependencies = [
  "numpy>=1.23",
  "Pillow>=10.0",
]

[tool.setuptools]
packages = ["adsrlab"]
